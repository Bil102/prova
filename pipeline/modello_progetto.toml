# Configurazione di un singolo video. I percorsi sono relativi a questa cartella.

[narratore]
genere = ""            # "uomo" o "donna" — OBBLIGATORIO prima di `traduci`
nome = ""              # nome italiano del narratore, se ne ha uno (es. "Marco")

[nomi]
# Sostituzioni di nomi già decise per questa serie di contenuti (vedi regole_adattamento.md)
Tim = "Marco"
Rick = "Marco"

[pulizia]
metodo = "vmake"       # manuale | vmake | sfoca | delogo | ritaglia | nessuno
vmake_task = "SKM0005"   # task Vmake per metodo = "vmake" (SKM0005 = AI Remover Pro)
# area dei sottotitoli in pixel [x, y, larghezza, altezza] (per sfoca/delogo/ritaglia)
# area = [0, 1450, 1080, 260]

[trascrizione]
backend = "locale"     # openai (API, serve OPENAI_API_KEY) | locale (faster-whisper)
modello_locale = "large-v3"
lingua = "en"

[traduzione]
modello = "claude-opus-5-5"
effort = "high"
istruzioni_extra = ""  # es. "accorcia di circa il 20%" oppure "mantieni la variante Pro"

[verifica]
brand_vietati = []     # brand extra da segnalare, oltre a quelli standard

[voce]
modello = "eleven_multilingual_v2"
stability = 0.5
similarity_boost = 0.75
style = 0.0
velocita = 1.0         # 0.7–1.2
pausa_blocchi = 0.3    # secondi di silenzio tra blocchi di speaker diversi

[voce.speaker]
# speaker → voice_id ElevenLabs. Senza intestazioni [Nome] nello script lo speaker è "narratore".
narratore = "VOICE_ID"

[adattamento]
# step `adatta`: video accelerato fino a velocita_video e voce adattata alla nuova durata;
# se la voce supererebbe max_velocita_voce, si accelera solo la voce (video invariato)
velocita_video = 1.1
max_velocita_voce = 1.15
coda = 0.5             # secondi di video dopo l'ultima parola

[montaggio]
adattamento = "auto"   # auto | congela | nessuno  (vedi pipeline/monta.py)
max_velocita = 1.08    # accelerazione massima della voce se più lunga del video
coda = 0.5             # secondi di video dopo l'ultima parola
volume_audio_originale = 0.0   # >0 per tenere l'audio ambiente originale (attenzione alla voce EN)

# [[montaggio.broll]]
# clip = "broll/supermercato.mp4"
# inizio = 12.0
# fine = 15.5

# [[montaggio.overlay]]
# immagine = "overlay_offerta.png"
# inizio = 20.0
# fine = 26.0
# x = "(W-w)/2"
# y = "H*0.72"
# dissolvenza = 0.3

[musica]
file = ""              # es. "musica/sottofondo.mp3" — vuoto = step saltato
volume = 0.15
fade_in = 1.0
fade_out = 2.0
ducking = true

[export]
larghezza = 1080
altezza = 1920
adatta = "pad"         # pad | crop | nessuno
fps = 30
crf = 20
preset = "medium"
audio_kbps = 192
loudnorm = -14
